name: Build Flutter iOS IPA

on:
  push:
    branches: [ main ] # 提交到 main 分支时自动触发打包
  workflow_dispatch:   # 支持手动点击触发

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # 1. 拉取 Flutter 源码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Java 环境
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. 配置 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2' # 匹配你的 Flutter 版本
          channel: 'stable'
          cache: true

      # 4. 解密并安装证书与描述文件
      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          # Base64 解密回二进制文件
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -d > $CERTIFICATE_PATH
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 -d > $PP_PATH
          
          # 创建云端临时 KeyChain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # 导入证书
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # 钥匙串加入系统默认搜索列表
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH

          # 安装描述文件
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # 5. 安装项目依赖
      - name: Install Dependencies
        run: flutter pub get

      # 6. 【核心修改】编译归档并使用苹果原生 xcodebuild 导出 IPA
      - name: Build IPA
        run: |
          # 1) 编译 iOS Archive (加上 --no-codesign 绕过开发证书检查)
          flutter build ipa --release --no-codesign \
            --build-number=${{ github.run_number }}
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

          # 2) 使用苹果原生工具拿着发布证书和 ExportOptions 导出正规 IPA
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      # 7. 上传 IPA 文件至 GitHub Artifacts 供下载
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-release
          path: build/ios/ipa/*.ipa